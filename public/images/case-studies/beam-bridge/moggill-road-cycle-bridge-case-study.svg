<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moggill Road Cycle Bridge public case study</title>
  <desc id="desc">An original evidence-boundary schematic records the 218 metre total length, nine spans in the published 17 to 32 metre range, prestressed concrete T-girders, off-site precasting and the smooth cycle-joint design intent without inventing individual span lengths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset="1" stop-color="#eaf2f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0b1838" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="82" y="48" width="360" height="42" rx="21" fill="#e5f7f5" stroke="#0a9b91" stroke-width="2"/>
    <text x="262" y="76" text-anchor="middle" font-size="19" font-weight="780" letter-spacing="1.2" fill="#007a74">PUBLIC REFERENCE · NOT AN F1 PROJECT</text>
    <text x="82" y="145" font-size="50" font-weight="760" fill="#0b1838">Moggill Road Cycle Bridge</text>
    <text x="83" y="190" font-size="24" fill="#4f6275">Published quantities are separated from geometry that the public source does not map.</text>

    <g transform="translate(82 226)" filter="url(#shadow)">
      <rect width="1436" height="282" rx="24" fill="#ffffff"/>
      <text x="30" y="43" font-size="21" font-weight="770" letter-spacing="1.3" fill="#0a9b91">SPAN COUNT DIAGRAM · NINE CELLS ARE NOT INDIVIDUAL SPAN LENGTHS</text>
      <text x="1406" y="43" text-anchor="end" font-size="19" fill="#647789">No terrain, pier height or span order inferred</text>

      <!-- Equal cells encode count only. They are deliberately detached from an elevation. -->
      <g transform="translate(58 82)">
        <g fill="#e8f6f5" stroke="#0a9b91" stroke-width="3">
          <rect x="0" y="0" width="142" height="78" rx="8"/><rect x="142" y="0" width="142" height="78" rx="8"/><rect x="284" y="0" width="142" height="78" rx="8"/>
          <rect x="426" y="0" width="142" height="78" rx="8"/><rect x="568" y="0" width="142" height="78" rx="8"/><rect x="710" y="0" width="142" height="78" rx="8"/>
          <rect x="852" y="0" width="142" height="78" rx="8"/><rect x="994" y="0" width="142" height="78" rx="8"/><rect x="1136" y="0" width="142" height="78" rx="8"/>
        </g>
        <g text-anchor="middle" font-size="22" font-weight="800" fill="#0b1838">
          <text x="71" y="49">S1</text><text x="213" y="49">S2</text><text x="355" y="49">S3</text><text x="497" y="49">S4</text><text x="639" y="49">S5</text>
          <text x="781" y="49">S6</text><text x="923" y="49">S7</text><text x="1065" y="49">S8</text><text x="1207" y="49">S9</text>
        </g>
        <path d="M0 118 H1278" stroke="#17315f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="639" y="110" text-anchor="middle" font-size="22" font-weight="790" fill="#17315f">Σ L<tspan baseline-shift="sub" font-size="15">i</tspan> = 218 m OVERALL</text>
        <text x="639" y="158" text-anchor="middle" font-size="23" font-weight="790" fill="#007a74">9 SPANS · EACH PUBLISHED SPAN L<tspan baseline-shift="sub" font-size="15">i</tspan> IS WITHIN 17–32 m</text>
      </g>
    </g>

    <g transform="translate(82 540)">
      <g filter="url(#shadow)">
        <rect width="700" height="244" rx="22" fill="#ffffff"/>
        <text x="28" y="43" font-size="20" font-weight="770" letter-spacing="1.2" fill="#0a9b91">PRESTRESSED-CONCRETE T-GIRDER PRINCIPLE</text>
        <path d="M54 91 H354 V119 H237 V219 H171 V119 H54 Z" fill="#0b1838"/>
        <path d="M54 78 H354" stroke="#0a9b91" stroke-width="8"/>
        <path d="M392 110 H442" stroke="#0a9b91" stroke-width="4" marker-end="url(#arrow)"/>
        <text x="466" y="105" font-size="22" font-weight="780" fill="#0b1838">Off-site precasting</text>
        <text x="466" y="138" font-size="19" fill="#596d7d">Girders up to 103 t</text>
        <text x="466" y="167" font-size="19" fill="#596d7d">350 t and 500 t cranes</text>
        <text x="466" y="204" font-size="18" fill="#647789">Member form only;</text>
        <text x="466" y="228" font-size="18" fill="#647789">count and spacing not inferred.</text>
      </g>

      <g transform="translate(728 0)" filter="url(#shadow)">
        <rect width="708" height="244" rx="22" fill="#0b1838"/>
        <text x="28" y="43" font-size="20" font-weight="770" letter-spacing="1.2" fill="#62d5cc">CYCLE-SURFACE JOINT DESIGN INTENT</text>
        <!-- Flush surfaces and a narrow abstract movement zone; no proprietary joint type implied. -->
        <path d="M38 110 H314" stroke="#ffffff" stroke-width="10"/><path d="M394 110 H670" stroke="#ffffff" stroke-width="10"/>
        <rect x="314" y="101" width="80" height="18" rx="3" fill="#62d5cc"/>
        <path d="M338 79 H300 M370 79 H408" stroke="#62d5cc" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <circle cx="354" cy="110" r="31" fill="none" stroke="#ffcb83" stroke-width="4" stroke-dasharray="7 6"/>
        <text x="38" y="168" font-size="22" font-weight="780" fill="#ffffff">Flush riding line · movement accommodated</text>
        <text x="38" y="202" font-size="19" fill="#c8d7df">TMR records a smooth profile selected to avoid</text>
        <text x="38" y="228" font-size="19" fill="#c8d7df">bumps and wheel gaps; mechanism shown is abstract.</text>
      </g>
    </g>

    <text x="82" y="842" font-size="18" fill="#647789">Source: Queensland Department of Transport and Main Roads · official Moggill Road Cycle Bridge project page</text>
    <text x="1518" y="842" font-size="18" text-anchor="end" fill="#647789">Original explanatory schematic</text>
    <text x="82" y="872" font-size="18" fill="#647789">Evidence boundary: span count, overall length, span range, T-girder system, girder mass, crane capacities and joint intent are published.</text>
    <text x="1518" y="872" font-size="18" text-anchor="end" fill="#647789">Not a project drawing · not to scale</text>
  </g>
</svg>
