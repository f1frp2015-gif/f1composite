<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">São Silvestre GFRP footbridge public research case study</title>
  <desc id="desc">An original proportional engineering schematic presents the 11 metre overall length, 10 metre installed support span, 2 metre width, two 400 by 200 by 15 millimetre pultruded GFRP I-girders and 37.5 millimetre SFRSCC deck. The earlier 10.5 metre prototype support span is separately identified.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset="1" stop-color="#eaf2f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0b1838" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/></marker>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#17315f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="82" y="48" width="360" height="42" rx="21" fill="#e5f7f5" stroke="#0a9b91" stroke-width="2"/>
    <text x="262" y="76" text-anchor="middle" font-size="19" font-weight="780" letter-spacing="1.2" fill="#007a74">PUBLIC REFERENCE · NOT AN F1 PROJECT</text>
    <text x="82" y="145" font-size="50" font-weight="760" fill="#0b1838">São Silvestre GFRP footbridge</text>
    <text x="83" y="190" font-size="24" fill="#4f6275">Known longitudinal and section dimensions are drawn proportionally, with enlargements where needed.</text>

    <g transform="translate(82 225)" filter="url(#shadow)">
      <rect width="930" height="350" rx="24" fill="#ffffff"/>
      <text x="28" y="43" font-size="21" font-weight="770" letter-spacing="1.3" fill="#0a9b91">INSTALLED ELEVATION · LENGTH AND MEMBER DEPTH PROPORTIONAL</text>

      <!-- 11.0 m = 760 units; 10.0 m support span = 690.91 units; 0.4 m girder = 27.64 units. -->
      <path d="M85 202 H845" stroke="#0a9b91" stroke-width="4"/>
      <rect x="85" y="206" width="760" height="3" fill="#a9babc"/>
      <rect x="85" y="209" width="760" height="4" fill="#17315f"/>
      <rect x="85" y="213" width="760" height="20" fill="#17315f" opacity="0.92"/>
      <rect x="85" y="233" width="760" height="4" fill="#0b1838"/>
      <text x="465" y="264" text-anchor="middle" font-size="18" fill="#647789">Near I-girder in side elevation; the second main girder is behind it.</text>

      <!-- Bearings are located at the support centre lines, 34.55 units from each end. -->
      <g fill="#0a9b91"><rect x="102" y="237" width="36" height="12" rx="3"/><rect x="792" y="237" width="36" height="12" rx="3"/></g>
      <g fill="#0b1838"><path d="M94 249 H146 L162 274 H78 Z"/><path d="M784 249 H836 L852 274 H768 Z"/></g>

      <path d="M120 111 H810" stroke="#0a9b91" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M120 103 V249 M810 103 V249" stroke="#0a9b91" stroke-width="2"/>
      <rect x="300" y="86" width="330" height="44" rx="22" fill="#e5f7f5"/>
      <text x="465" y="115" text-anchor="middle" font-size="21" font-weight="790" fill="#007a74">10.0 m INSTALLED SUPPORT SPAN</text>

      <path d="M85 310 H845" stroke="#17315f" stroke-width="3" marker-start="url(#arrowNavy)" marker-end="url(#arrowNavy)"/>
      <path d="M85 278 V322 M845 278 V322" stroke="#17315f" stroke-width="2"/>
      <text x="465" y="303" text-anchor="middle" font-size="21" font-weight="790" fill="#17315f">11.0 m OVERALL LENGTH</text>
    </g>

    <g transform="translate(1040 225)" filter="url(#shadow)">
      <rect width="478" height="350" rx="24" fill="#ffffff"/>
      <text x="26" y="43" font-size="21" font-weight="770" letter-spacing="1.3" fill="#0a9b91">TRANSVERSE SECTION</text>
      <text x="26" y="72" font-size="18" fill="#647789">Section sizes to scale · girder spacing schematic</text>

      <!-- 2.0 m width = 400 units; 37.5 mm deck = 7.5 units. -->
      <rect x="39" y="126" width="400" height="7.5" rx="2" fill="#a9babc" stroke="#7e939d" stroke-width="2"/>
      <text x="239" y="114" text-anchor="middle" font-size="18" font-weight="750" fill="#596d7d">37.5 mm SFRSCC DECK</text>

      <!-- Each exact I-section: 200 mm wide = 40 units; 400 mm deep = 80 units; t = 15 mm = 3 units. -->
      <g fill="#0b1838">
        <path d="M129 134 H169 V137 H150.5 V211 H169 V214 H129 V211 H147.5 V137 H129 Z"/>
        <path d="M309 134 H349 V137 H330.5 V211 H349 V214 H309 V211 H327.5 V137 H309 Z"/>
      </g>
      <path d="M39 250 H439" stroke="#0a9b91" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="239" y="243" text-anchor="middle" font-size="21" font-weight="790" fill="#007a74">2.0 m OVERALL WIDTH</text>
      <text x="239" y="287" text-anchor="middle" font-size="20" font-weight="790" fill="#0b1838">2 × GFRP I 400 × 200 × 15 mm</text>
      <text x="239" y="317" text-anchor="middle" font-size="18" fill="#596d7d">Girder centre spacing is not dimensioned here.</text>
    </g>

    <g transform="translate(82 606)">
      <g filter="url(#shadow)">
        <rect width="430" height="112" rx="19" fill="#ffffff"/>
        <text x="23" y="35" font-size="19" font-weight="770" letter-spacing="1.1" fill="#0a9b91">MAIN GIRDER SECTION</text>
        <text x="23" y="79" font-size="31" font-weight="800" fill="#0b1838">400 × 200 × 15 mm</text>
        <text x="23" y="101" font-size="18" fill="#596d7d">Pultruded GFRP I-shape</text>
      </g>
      <g transform="translate(454 0)" filter="url(#shadow)">
        <rect width="420" height="112" rx="19" fill="#ffffff"/>
        <text x="23" y="35" font-size="19" font-weight="770" letter-spacing="1.1" fill="#0a9b91">DECK SYSTEM</text>
        <text x="23" y="77" font-size="28" font-weight="790" fill="#0b1838">37.5 mm SFRSCC plate</text>
        <text x="23" y="101" font-size="18" fill="#596d7d">Steel-fibre-reinforced concrete</text>
      </g>
      <g transform="translate(898 0)" filter="url(#shadow)">
        <rect width="538" height="112" rx="19" fill="#ffffff"/>
        <text x="23" y="35" font-size="19" font-weight="770" letter-spacing="1.1" fill="#0a9b91">CONNECTION EVIDENCE</text>
        <text x="23" y="77" font-size="27" font-weight="790" fill="#0b1838">M10 stainless bolts + GFRP angles</text>
        <text x="23" y="101" font-size="18" fill="#596d7d">Main-to-secondary topology; count and spacing not inferred</text>
      </g>
    </g>

    <g transform="translate(82 748)">
      <rect width="1436" height="76" rx="18" fill="#0b1838"/>
      <text x="27" y="31" font-size="20" font-weight="770" letter-spacing="1.2" fill="#62d5cc">RESEARCH VALUE</text>
      <text x="27" y="58" font-size="19" fill="#ffffff">Full-scale static, dynamic and creep testing preceded service; later monitoring calibrated modal behaviour and damping.</text>
      <rect x="1118" y="18" width="290" height="40" rx="20" fill="#fff4e7"/>
      <text x="1263" y="44" text-anchor="middle" font-size="18" font-weight="790" fill="#8b4c0c">PROTOTYPE TEST SPAN · 10.5 m</text>
    </g>
    <text x="82" y="866" font-size="18" fill="#647789">Sources: Gonilha et al. (2014) and Dacol et al. (2022) · peer-reviewed research</text>
    <text x="1518" y="866" font-size="18" text-anchor="end" fill="#647789">Installed support span: 10.0 m · operational since 2015</text>
  </g>
</svg>
