<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Coronation Drive cycleway FRP girder public reference</title>
  <desc id="desc">An original exploded engineering schematic shows the Queensland TMR-described system of an ECC plate deck over six glued pultruded FRP hollow-section main girders at 575 millimetre centres. It distinguishes the published 3 metre overall and 2.72 metre effective widths from the unpublished longitudinal span.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#e8f2f1"/>
    </linearGradient>
    <linearGradient id="frp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a9b91"/>
      <stop offset="0.5" stop-color="#087f78"/>
      <stop offset="1" stop-color="#0a9b91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0b1838" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="82" y="48" width="322" height="38" rx="19" fill="#e5f7f5" stroke="#0a9b91" stroke-width="2"/>
    <text x="243" y="74" text-anchor="middle" font-size="17" font-weight="780" letter-spacing="1.2" fill="#007a74">PUBLIC REFERENCE · NOT AN F1 PROJECT</text>
    <text x="82" y="139" font-size="48" font-weight="760" fill="#0b1838">Coronation Drive cycleway: FRP girder system</text>
    <text x="83" y="181" font-size="22" fill="#4f6275">A lightweight short-span concept documented in Queensland active-user bridge guidance.</text>

    <g transform="translate(82 221)">
      <g filter="url(#shadow)">
        <rect width="928" height="490" rx="24" fill="#ffffff"/>
        <text x="30" y="42" font-size="18" font-weight="760" letter-spacing="1.4" fill="#0a9b91">EXPLODED SYSTEM SCHEMATIC</text>

        <path d="M169 128 L768 91 L852 138 L253 175 Z" fill="#b8c8c9" stroke="#7d929b" stroke-width="3"/>
        <path d="M253 175 L852 138 V166 L253 203 Z" fill="#95a9ae"/>
        <path d="M169 128 L253 175 V203 L169 156 Z" fill="#d8e3e3"/>
        <text x="542" y="91" font-size="18" font-weight="760" text-anchor="middle" fill="#0b1838">ECC PLATE DECK</text>
        <path d="M719 73 L773 103" stroke="#0a9b91" stroke-width="3" marker-end="url(#arrow)"/>

        <g stroke="#0a9b91" stroke-width="3" stroke-dasharray="8 7">
          <path d="M239 220 L239 252"/>
          <path d="M410 210 L410 242"/>
          <path d="M581 200 L581 232"/>
          <path d="M752 190 L752 222"/>
        </g>
        <text x="125" y="237" font-size="16" font-weight="720" fill="#007a74">GLUED INTERFACE</text>

        <g>
          <path d="M158 275 L736 240 L809 282 L231 317 Z" fill="url(#frp)" stroke="#076f69" stroke-width="3"/>
          <path d="M231 317 L809 282 V355 L231 390 Z" fill="#087f78"/>
          <path d="M158 275 L231 317 V390 L158 348 Z" fill="#0a9b91"/>
          <path d="M185 294 L721 262 L770 290 L234 323 Z" fill="#ffffff" opacity="0.9"/>
          <path d="M234 323 L770 290 V333 L234 366 Z" fill="#e6f3f2"/>
          <path d="M185 294 L234 323 V366 L185 337 Z" fill="#f7fbfb"/>
        </g>
        <text x="497" y="435" text-anchor="middle" font-size="23" font-weight="780" fill="#0b1838">GLUED PULTRUDED FRP HOLLOW SECTIONS</text>
        <text x="497" y="464" text-anchor="middle" font-size="17" fill="#596d7d">Low transport mass can reduce lifting demand where access is constrained.</text>
      </g>

      <g transform="translate(958 0)">
        <g filter="url(#shadow)">
          <rect width="478" height="214" rx="24" fill="#0b1838"/>
          <text x="27" y="43" font-size="17" font-weight="760" letter-spacing="1.3" fill="#62d5cc">WHAT THE GUIDANCE ACTUALLY SAYS</text>
          <text x="27" y="102" font-size="28" font-weight="780" fill="#ffffff">System type: useful for</text>
          <text x="27" y="141" font-size="38" font-weight="800" fill="#62d5cc">short spans up to 12 m</text>
          <text x="27" y="183" font-size="16" fill="#c8d7df">This is general system guidance—not this bridge's span.</text>
        </g>

        <g transform="translate(0 242)" filter="url(#shadow)">
          <rect width="478" height="248" rx="24" fill="#ffffff"/>
          <rect width="10" height="248" rx="5" fill="#e58a2b"/>
          <text x="34" y="39" font-size="16" font-weight="760" letter-spacing="1.2" fill="#b55e16">PUBLISHED GEOMETRY + EVIDENCE BOUNDARY</text>
          <text x="34" y="76" font-size="22" font-weight="780" fill="#0b1838">Longitudinal span: not published</text>
          <path d="M34 95 H444" stroke="#d7e3e3" stroke-width="2"/>
          <rect x="57" y="112" width="364" height="13" rx="4" fill="#a9babc"/>
          <g fill="#0a9b91">
            <rect x="69" y="127" width="42" height="31" rx="4"/>
            <rect x="129" y="127" width="42" height="31" rx="4"/>
            <rect x="189" y="127" width="42" height="31" rx="4"/>
            <rect x="249" y="127" width="42" height="31" rx="4"/>
            <rect x="309" y="127" width="42" height="31" rx="4"/>
            <rect x="369" y="127" width="42" height="31" rx="4"/>
          </g>
          <text x="239" y="184" text-anchor="middle" font-size="17" font-weight="760" fill="#0b1838">3,000 mm overall · 2,720 mm effective</text>
          <text x="239" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#007a74">6 MAIN GIRDERS @ 575 mm CENTRES</text>
          <text x="239" y="238" text-anchor="middle" font-size="14" fill="#596d7d">ECC plate above glued pultruded hollow sections</text>
        </g>
      </g>
    </g>

    <g transform="translate(82 747)">
      <rect width="1436" height="77" rx="18" fill="#ffffff" stroke="#c5d5d6" stroke-width="2"/>
      <text x="25" y="31" font-size="17" font-weight="760" fill="#0b1838">DESIGN TRANSFER</text>
      <text x="25" y="56" font-size="16" fill="#596d7d">For another site, independently verify section properties, glued connections, deck compatibility, fire strategy, drainage, vibration and owner acceptance.</text>
      <text x="1410" y="48" text-anchor="end" font-size="16" fill="#647789">Illustrative · not to scale</text>
    </g>

    <text x="82" y="866" font-size="16" fill="#647789">Source: Queensland TMR · Options for designers of pedestrian and cyclist bridges (2023)</text>
    <text x="1518" y="866" font-size="16" text-anchor="end" fill="#647789">No longitudinal span inferred</text>
  </g>
</svg>
