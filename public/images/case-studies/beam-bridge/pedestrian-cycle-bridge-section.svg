<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pedestrian and cycle beam bridge cross-section</title>
  <desc id="desc">An engineering cross-section identifies the owner-defined clear width, barriers, deck crossfall and drainage, longitudinal girders, crossbeam and bearings.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#edf4f4"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce8e9"/>
      <stop offset="0.5" stop-color="#f4f8f8"/>
      <stop offset="1" stop-color="#dce8e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#0b1838" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/>
    </marker>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0b1838"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="82" y="81" font-size="24" font-weight="750" letter-spacing="3" fill="#0a9b91">CROSS-SECTION CONTROL POINTS</text>
    <text x="82" y="142" font-size="49" font-weight="760" fill="#0b1838">The usable path is only one design layer</text>
    <text x="83" y="185" font-size="22" fill="#4f6275">Geometry, drainage, containment and inspection access must work as one section.</text>

    <g transform="translate(0 12)">
      <path d="M270 389 L1330 389 L1289 507 L311 507 Z" fill="url(#deck)" stroke="#8ca2aa" stroke-width="4" filter="url(#shadow)"/>
      <path d="M292 410 L1308 410" stroke="#0a9b91" stroke-width="7"/>
      <path d="M292 423 L1308 423" stroke="#b5c8ca" stroke-width="2" stroke-dasharray="10 9"/>

      <g fill="#0b1838">
        <path d="M362 507 H542 V535 H480 V670 H542 V698 H362 V670 H424 V535 H362 Z"/>
        <path d="M710 507 H890 V535 H828 V670 H890 V698 H710 V670 H772 V535 H710 Z"/>
        <path d="M1058 507 H1238 V535 H1176 V670 H1238 V698 H1058 V670 H1120 V535 H1058 Z"/>
      </g>
      <rect x="390" y="560" width="820" height="42" rx="7" fill="#17315f" opacity="0.94"/>
      <g fill="#0a9b91">
        <rect x="400" y="699" width="104" height="22" rx="6"/>
        <rect x="748" y="699" width="104" height="22" rx="6"/>
        <rect x="1096" y="699" width="104" height="22" rx="6"/>
      </g>
      <g fill="#a8babc">
        <path d="M388 725 H516 L543 758 H361 Z"/>
        <path d="M736 725 H864 L891 758 H709 Z"/>
        <path d="M1084 725 H1212 L1239 758 H1057 Z"/>
      </g>

      <g fill="none" stroke="#0b1838" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M292 410 V279 M323 410 V283 M292 279 H323 M286 319 H329 M286 361 H329"/>
        <path d="M1277 410 V279 M1308 410 V283 M1277 279 H1308 M1271 319 H1314 M1271 361 H1314"/>
      </g>
      <rect x="280" y="394" width="55" height="39" rx="5" fill="#17315f"/>
      <rect x="1265" y="394" width="55" height="39" rx="5" fill="#17315f"/>

      <path d="M448 368 H1152" fill="none" stroke="#0a9b91" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
      <path d="M448 346 V389 M1152 346 V389" stroke="#0a9b91" stroke-width="2"/>
      <rect x="610" y="322" width="380" height="44" rx="22" fill="#e5f7f5" stroke="#0a9b91" stroke-width="2"/>
      <text x="800" y="351" text-anchor="middle" font-size="18" font-weight="760" fill="#007a74">CLEAR WIDTH · OWNER / JURISDICTION DEFINED</text>

      <path d="M665 442 L930 455" fill="none" stroke="#e58a2b" stroke-width="4" marker-end="url(#arrowNavy)"/>
      <circle cx="952" cy="456" r="11" fill="#0a9b91"/>
      <path d="M952 456 V492" stroke="#0a9b91" stroke-width="4" marker-end="url(#arrowTeal)"/>
      <text x="798" y="477" text-anchor="middle" font-size="17" font-weight="700" fill="#b55e16">CROSSFALL</text>

      <g stroke="#566b7b" stroke-width="3" fill="none">
        <path d="M229 260 H292"/>
        <path d="M1371 260 H1308"/>
        <path d="M1355 475 H1292"/>
        <path d="M1370 569 H1210"/>
        <path d="M1350 693 H1199"/>
        <path d="M223 625 H389"/>
      </g>
      <g font-size="18" font-weight="730" fill="#0b1838">
        <text x="219" y="250" text-anchor="end">BARRIER / RAILING</text>
        <text x="1381" y="250">BARRIER / RAILING</text>
        <text x="1365" y="466">DECK + WEARING SURFACE</text>
        <text x="1380" y="562">TRANSVERSE CROSSBEAM</text>
        <text x="1360" y="686">BEARING</text>
        <text x="213" y="618" text-anchor="end">LONGITUDINAL GIRDER</text>
      </g>
      <text x="974" y="493" font-size="16" font-weight="700" fill="#007a74">DRAIN / SCUPPER</text>
    </g>

    <g transform="translate(82 786)">
      <rect width="1436" height="67" rx="16" fill="#ffffff" stroke="#c5d5d6" stroke-width="2"/>
      <rect width="10" height="67" rx="5" fill="#0a9b91"/>
      <text x="34" y="28" font-size="17" font-weight="760" fill="#0b1838">DESIGN NOTE</text>
      <text x="34" y="51" font-size="16" fill="#536777">Confirm effective width between obstacles, barrier geometry, surface drainage and bearing access in the owner-approved design brief.</text>
      <text x="1411" y="42" font-size="16" text-anchor="end" fill="#647789">Illustrative · not to scale</text>
    </g>
  </g>
</svg>
