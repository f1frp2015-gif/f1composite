<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="sectionMobileTitle sectionMobileDesc">
  <title id="sectionMobileTitle">Mobile cross-section of a pedestrian and cycle beam bridge</title>
  <desc id="sectionMobileDesc">A not-to-scale engineering cross-section identifies the owner-defined clear width, barriers, deck crossfall and drainage, longitudinal girders, bearings on a common pier cap, and a separate cross-member connection inset.</desc>
  <defs>
    <linearGradient id="sectionMobileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#e9f2f2"/>
    </linearGradient>
    <linearGradient id="sectionMobileDeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8e6e7"/>
      <stop offset="0.5" stop-color="#f4f8f8"/>
      <stop offset="1" stop-color="#d8e6e7"/>
    </linearGradient>
    <filter id="sectionMobileShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b1838" flood-opacity="0.13"/>
    </filter>
    <marker id="sectionMobileArrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/>
    </marker>
    <marker id="sectionMobileArrowNavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0b1838"/>
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#sectionMobileBg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="52" y="65" font-size="32" font-weight="760" letter-spacing="2.2" fill="#0a9b91">ACTIVE-USER CROSS-SECTION</text>
    <text x="52" y="125" font-size="48" font-weight="780" fill="#0b1838">Geometry + support logic</text>
    <text x="52" y="168" font-size="30" fill="#536879">Illustrative · dimensions are project-specific</text>

    <!-- Clear-width dimension -->
    <path d="M208 262 H692" fill="none" stroke="#0a9b91" stroke-width="4" marker-start="url(#sectionMobileArrowTeal)" marker-end="url(#sectionMobileArrowTeal)"/>
    <path d="M208 242 V323 M692 242 V323" stroke="#0a9b91" stroke-width="3"/>
    <rect x="147" y="207" width="606" height="53" rx="26.5" fill="#e6f8f6" stroke="#0a9b91" stroke-width="3"/>
    <text x="450" y="243" text-anchor="middle" font-size="30" font-weight="780" fill="#007a74">OWNER-DEFINED CLEAR WIDTH</text>

    <!-- Barriers -->
    <g fill="none" stroke="#0b1838" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M144 405 V282 M178 405 V288 M144 282 H178 M137 326 H185 M137 366 H185"/>
      <path d="M722 405 V282 M756 405 V288 M722 282 H756 M715 326 H763 M715 366 H763"/>
    </g>
    <rect x="126" y="389" width="70" height="43" rx="6" fill="#17315f"/>
    <rect x="704" y="389" width="70" height="43" rx="6" fill="#17315f"/>
    <text x="202" y="340" font-size="30" font-weight="750" fill="#0b1838">BARRIER</text>
    <path d="M178 331 H196" stroke="#526878" stroke-width="3"/>

    <!-- Deck, wearing surface, crossfall and drainage -->
    <g filter="url(#sectionMobileShadow)">
      <path d="M106 414 L450 423 L794 414 L768 503 H132 Z" fill="url(#sectionMobileDeck)" stroke="#718896" stroke-width="4"/>
      <path d="M123 426 L450 435 L777 426" fill="none" stroke="#0a9b91" stroke-width="8"/>
    </g>
    <path d="M318 397 L455 405" fill="none" stroke="#e58a2b" stroke-width="5" marker-end="url(#sectionMobileArrowNavy)"/>
    <text x="264" y="385" font-size="30" font-weight="760" fill="#b55e16">CROSSFALL</text>
    <circle cx="739" cy="438" r="12" fill="#0a9b91"/>
    <path d="M739 450 V490" stroke="#0a9b91" stroke-width="5" marker-end="url(#sectionMobileArrowTeal)"/>
    <text x="585" y="393" font-size="30" font-weight="750" fill="#007a74">DRAINAGE</text>

    <!-- Three longitudinal girders -->
    <g fill="#0b1838">
      <path d="M166 503 H326 V535 H273 V678 H326 V710 H166 V678 H219 V535 H166 Z"/>
      <path d="M370 503 H530 V535 H477 V678 H530 V710 H370 V678 H423 V535 H370 Z"/>
      <path d="M574 503 H734 V535 H681 V678 H734 V710 H574 V678 H627 V535 H574 Z"/>
    </g>
    <rect x="255" y="573" width="390" height="52" rx="26" fill="#ffffff" stroke="#9fb3b8" stroke-width="3"/>
    <text x="450" y="609" text-anchor="middle" font-size="30" font-weight="780" fill="#0b1838">LONGITUDINAL GIRDERS</text>

    <!-- Bearings on one common cap -->
    <g fill="#0a9b91">
      <rect x="195" y="717" width="102" height="28" rx="7"/>
      <rect x="399" y="717" width="102" height="28" rx="7"/>
      <rect x="603" y="717" width="102" height="28" rx="7"/>
    </g>
    <rect x="118" y="758" width="664" height="64" rx="9" fill="#17315f"/>
    <path d="M350 822 H550 L530 1042 H370 Z" fill="#0b1838"/>
    <path d="M279 1042 H621 L668 1096 H232 Z" fill="#9eb2b5" stroke="#718896" stroke-width="4"/>
    <text x="20" y="743" font-size="30" font-weight="760" fill="#007a74">BEARINGS</text>
    <path d="M177 733 H195" stroke="#0a9b91" stroke-width="3"/>
    <text x="450" y="801" text-anchor="middle" font-size="30" font-weight="780" fill="#ffffff">COMMON PIER CAP</text>

    <!-- Cross-member is shown as a connection inset, not through the girder webs -->
    <g transform="translate(525 842)">
      <rect width="322" height="214" rx="18" fill="#ffffff" stroke="#9fb3b8" stroke-width="3"/>
      <text x="161" y="42" text-anchor="middle" font-size="30" font-weight="780" fill="#0b1838">CONNECTION INSET</text>
      <path d="M32 71 H92 V184 H32 Z M230 71 H290 V184 H230 Z" fill="#0b1838"/>
      <rect x="92" y="103" width="138" height="49" rx="5" fill="#17315f" stroke="#0a9b91" stroke-width="4"/>
      <circle cx="111" cy="127" r="7" fill="#d9e7e8"/>
      <circle cx="211" cy="127" r="7" fill="#d9e7e8"/>
      <text x="161" y="199" text-anchor="middle" font-size="30" font-weight="750" fill="#007a74">CROSS-MEMBER</text>
    </g>

    <text x="450" y="1155" text-anchor="middle" font-size="30" font-weight="720" fill="#536879">Confirm deck, barriers, bearings + inspection access.</text>
  </g>
</svg>
