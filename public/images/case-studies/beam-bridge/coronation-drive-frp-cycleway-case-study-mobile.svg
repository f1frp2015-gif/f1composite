<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Coronation Drive FRP cycleway crossing mobile public reference</title>
  <desc id="desc">A mobile engineering schematic of the Queensland TMR-documented Coronation Drive cycleway system. It shows an ECC plate deck above six independent glued pultruded FRP rectangular hollow-section girders at 575 millimetre centres, with 3000 millimetres overall width and 2720 millimetres effective width. The longitudinal span is not published.</desc>
  <defs>
    <linearGradient id="coronationBackground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#e8f2f1"/>
    </linearGradient>
    <filter id="coronationShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1838" flood-opacity="0.12"/>
    </filter>
    <marker id="coronationArrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0a9b91"/>
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#coronationBackground)"/>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(45 45)" filter="url(#coronationShadow)">
      <rect width="810" height="600" rx="24" fill="#ffffff"/>
      <text x="30" y="55" font-size="31" font-weight="780" letter-spacing="1.2" fill="#0a9b91">PUBLISHED TRANSVERSE SYSTEM</text>

      <rect x="72" y="150" width="666" height="52" rx="6" fill="#a9babc" stroke="#7f949e" stroke-width="3"/>
      <text x="405" y="126" text-anchor="middle" font-size="32" font-weight="760" fill="#0b1838">ECC PLATE DECK</text>

      <g fill="#0a9b91">
        <rect x="96" y="202" width="68" height="16" rx="4"/>
        <rect x="210" y="202" width="68" height="16" rx="4"/>
        <rect x="324" y="202" width="68" height="16" rx="4"/>
        <rect x="438" y="202" width="68" height="16" rx="4"/>
        <rect x="552" y="202" width="68" height="16" rx="4"/>
        <rect x="666" y="202" width="68" height="16" rx="4"/>
      </g>

      <g fill="#e8f7f5" stroke="#0a9b91" stroke-width="5">
        <rect x="84" y="218" width="92" height="145" rx="6"/>
        <rect x="198" y="218" width="92" height="145" rx="6"/>
        <rect x="312" y="218" width="92" height="145" rx="6"/>
        <rect x="426" y="218" width="92" height="145" rx="6"/>
        <rect x="540" y="218" width="92" height="145" rx="6"/>
        <rect x="654" y="218" width="92" height="145" rx="6"/>
      </g>

      <text x="405" y="414" text-anchor="middle" font-size="32" font-weight="790" fill="#007a74">6 INDEPENDENT PULTRUDED FRP RHS</text>

      <text x="405" y="466" text-anchor="middle" font-size="31" font-weight="780" fill="#0b1838">3,000 mm OVERALL WIDTH</text>
      <path d="M72 495 H738" stroke="#0a9b91" stroke-width="4" marker-start="url(#coronationArrowTeal)" marker-end="url(#coronationArrowTeal)"/>
      <text x="405" y="544" text-anchor="middle" font-size="30" font-weight="760" fill="#007a74">2,720 mm EFFECTIVE WIDTH</text>
      <path d="M102 571 H708" stroke="#0a9b91" stroke-width="4" marker-start="url(#coronationArrowTeal)" marker-end="url(#coronationArrowTeal)"/>
    </g>

    <g transform="translate(45 680)">
      <g filter="url(#coronationShadow)">
        <rect width="385" height="180" rx="20" fill="#ffffff"/>
        <text x="24" y="51" font-size="30" font-weight="780" letter-spacing="1" fill="#0a9b91">GIRDER SPACING</text>
        <text x="24" y="126" font-size="46" font-weight="800" fill="#0b1838">575 mm c/c</text>
      </g>
      <g transform="translate(425 0)" filter="url(#coronationShadow)">
        <rect width="385" height="180" rx="20" fill="#ffffff"/>
        <text x="24" y="51" font-size="30" font-weight="780" letter-spacing="1" fill="#0a9b91">INTERFACE</text>
        <text x="24" y="105" font-size="34" font-weight="790" fill="#0b1838">Glued deck-to-RHS</text>
        <text x="24" y="145" font-size="30" fill="#4f6275">system</text>
      </g>
    </g>

    <g transform="translate(45 895)" filter="url(#coronationShadow)">
      <rect width="810" height="145" rx="20" fill="#fff7e9" stroke="#e58a2b" stroke-width="4"/>
      <text x="28" y="52" font-size="30" font-weight="790" letter-spacing="1" fill="#b55e16">EVIDENCE BOUNDARY</text>
      <text x="28" y="106" font-size="36" font-weight="800" fill="#0b1838">Longitudinal span: not published</text>
    </g>

    <text x="45" y="1098" font-size="30" font-weight="700" fill="#0b1838">Source · Queensland TMR active-user bridge guidance</text>
    <text x="45" y="1155" font-size="30" fill="#647789">Illustrative · not to scale · no span inferred</text>
  </g>
</svg>
