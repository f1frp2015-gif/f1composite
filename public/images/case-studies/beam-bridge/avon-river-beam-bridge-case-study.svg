<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Avon River Rail Bridge beam bridge case study</title>
  <desc id="desc">An original, not-to-scale elevation of the 504 metre Avon River Rail Bridge in Victoria, Australia, with key public project facts: 36 precast concrete beams in 18 pairs, beams 28 metres long and 60 tonnes each, and more than 100 piles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#dcebec"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7dadd"/>
      <stop offset="0.5" stop-color="#7fc3c3"/>
      <stop offset="1" stop-color="#b7dadd"/>
    </linearGradient>
    <linearGradient id="girder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a9b5"/>
      <stop offset="0.5" stop-color="#d3dde1"/>
      <stop offset="1" stop-color="#94a9b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1838" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 645 C250 615 420 671 705 638 C1020 600 1270 654 1600 619 L1600 900 L0 900 Z" fill="#c9ded3"/>
  <path d="M0 720 C310 680 550 735 830 703 C1130 668 1360 710 1600 690 L1600 900 L0 900 Z" fill="url(#river)"/>
  <g opacity="0.42" stroke="#ffffff" stroke-width="4">
    <path d="M80 763 Q250 736 420 763 T760 763 T1100 763 T1440 763" fill="none"/>
    <path d="M170 815 Q340 788 510 815 T850 815 T1190 815 T1530 815" fill="none"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(72 64)">
      <rect width="395" height="42" rx="21" fill="#0b1838"/>
      <text x="197.5" y="28" font-size="18" font-weight="750" letter-spacing="1.2" text-anchor="middle" fill="#ffffff">PUBLIC ENGINEERING REFERENCE</text>
    </g>
    <text x="72" y="158" font-size="50" font-weight="770" fill="#0b1838">Avon River Rail Bridge</text>
    <text x="73" y="202" font-size="25" fill="#4f6275">Stratford, Victoria, Australia · Completed December 2020</text>

    <g transform="translate(1038 48)">
      <rect width="490" height="175" rx="24" fill="#ffffff" opacity="0.95"/>
      <rect width="9" height="175" rx="4" fill="#0a9b91"/>
      <text x="34" y="44" font-size="17" font-weight="750" letter-spacing="1" fill="#007a74">WHY THIS CASE MATTERS</text>
      <text x="34" y="79" font-size="22" font-weight="700" fill="#0b1838">Repeatable precast spans</text>
      <text x="34" y="111" font-size="18" fill="#4f6275">Pair-by-pair erection turned a long crossing</text>
      <text x="34" y="138" font-size="18" fill="#4f6275">into a sequence of manageable beam lifts.</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M83 448 L1517 448 L1517 478 L83 478 Z" fill="#0b1838"/>
      <path d="M95 478 L1505 478 L1490 527 L110 527 Z" fill="url(#girder)"/>
      <rect x="112" y="527" width="1376" height="18" rx="4" fill="#8298a4"/>
      <g fill="#879aa4">
        <rect x="130" y="545" width="28" height="137" rx="4"/>
        <rect x="209" y="545" width="28" height="114" rx="4"/>
        <rect x="288" y="545" width="28" height="91" rx="4"/>
        <rect x="367" y="545" width="28" height="111" rx="4"/>
        <rect x="446" y="545" width="28" height="138" rx="4"/>
        <rect x="525" y="545" width="28" height="153" rx="4"/>
        <rect x="604" y="545" width="28" height="139" rx="4"/>
        <rect x="683" y="545" width="28" height="116" rx="4"/>
        <rect x="762" y="545" width="28" height="98" rx="4"/>
        <rect x="841" y="545" width="28" height="115" rx="4"/>
        <rect x="920" y="545" width="28" height="138" rx="4"/>
        <rect x="999" y="545" width="28" height="153" rx="4"/>
        <rect x="1078" y="545" width="28" height="137" rx="4"/>
        <rect x="1157" y="545" width="28" height="110" rx="4"/>
        <rect x="1236" y="545" width="28" height="91" rx="4"/>
        <rect x="1315" y="545" width="28" height="111" rx="4"/>
        <rect x="1394" y="545" width="28" height="136" rx="4"/>
        <rect x="1473" y="545" width="28" height="109" rx="4"/>
      </g>
      <g fill="#687f89">
        <ellipse cx="144" cy="681" rx="26" ry="8"/>
        <ellipse cx="460" cy="682" rx="26" ry="8"/>
        <ellipse cx="539" cy="698" rx="26" ry="8"/>
        <ellipse cx="1013" cy="698" rx="26" ry="8"/>
        <ellipse cx="1092" cy="683" rx="26" ry="8"/>
        <ellipse cx="1408" cy="681" rx="26" ry="8"/>
      </g>
      <g stroke="#ffffff" stroke-width="3" opacity="0.7">
        <path d="M162 478 V526 M241 478 V526 M320 478 V526 M399 478 V526 M478 478 V526 M557 478 V526 M636 478 V526 M715 478 V526 M794 478 V526 M873 478 V526 M952 478 V526 M1031 478 V526 M1110 478 V526 M1189 478 V526 M1268 478 V526 M1347 478 V526 M1426 478 V526"/>
      </g>
    </g>

    <g transform="translate(105 315)">
      <line x1="0" y1="75" x2="1390" y2="75" stroke="#0a9b91" stroke-width="4" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
      <rect x="561" y="45" width="268" height="56" rx="28" fill="#e8faf8" stroke="#0a9b91" stroke-width="2"/>
      <text x="695" y="81" font-size="25" font-weight="800" text-anchor="middle" fill="#007a74">504 m total length</text>
    </g>

    <g transform="translate(72 748)">
      <g>
        <rect width="330" height="100" rx="18" fill="#ffffff" opacity="0.96"/>
        <text x="24" y="37" font-size="31" font-weight="800" fill="#0b1838">36 beams</text>
        <text x="24" y="70" font-size="18" fill="#4f6275">installed in 18 pairs</text>
      </g>
      <g transform="translate(352)">
        <rect width="330" height="100" rx="18" fill="#ffffff" opacity="0.96"/>
        <text x="24" y="37" font-size="31" font-weight="800" fill="#0b1838">28 m each</text>
        <text x="24" y="70" font-size="18" fill="#4f6275">precast concrete beams</text>
      </g>
      <g transform="translate(704)">
        <rect width="330" height="100" rx="18" fill="#ffffff" opacity="0.96"/>
        <text x="24" y="37" font-size="31" font-weight="800" fill="#0b1838">60 t each</text>
        <text x="24" y="70" font-size="18" fill="#4f6275">individual beam mass</text>
      </g>
      <g transform="translate(1056)">
        <rect width="330" height="100" rx="18" fill="#ffffff" opacity="0.96"/>
        <text x="24" y="37" font-size="31" font-weight="800" fill="#0b1838">100+ piles</text>
        <text x="24" y="70" font-size="18" fill="#4f6275">precast concrete foundations</text>
      </g>
    </g>

    <text x="72" y="882" font-size="17" fill="#5b6d7e">Public project reference · not an F1 project</text>
    <text x="1528" y="882" font-size="17" text-anchor="end" fill="#5b6d7e">Engineering illustration · not to scale</text>
  </g>
</svg>
