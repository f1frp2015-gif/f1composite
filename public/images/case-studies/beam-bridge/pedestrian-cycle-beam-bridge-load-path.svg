<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pedestrian and cycle beam bridge load path</title>
  <desc id="desc">A one-shot animated engineering elevation showing distributed self-weight and active-user loads passing through the deck and transverse distribution system into longitudinal girders, bearings, supports, foundations and ground.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset="1" stop-color="#eaf2f2"/></linearGradient>
    <linearGradient id="girder" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17315f"/><stop offset="0.5" stop-color="#0b1838"/><stop offset="1" stop-color="#17315f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0b1838" flood-opacity="0.13"/></filter>
    <pattern id="soil" width="24" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><line x1="0" y1="0" x2="0" y2="18" stroke="#bdd0d1" stroke-width="3"/></pattern>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0b1838"/></marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e58a2b"/></marker>
    <style>
      .flow { opacity: 1; stroke-dasharray: 15 9; animation: trace 0.72s ease-out 1 both; }
      .step-1 { animation-delay: 0.2s; } .step-2 { animation-delay: 1.05s; } .step-3 { animation-delay: 1.9s; } .step-4 { animation-delay: 2.75s; }
      .pulse { animation: pulse 0.72s ease-out 1 both; } .pulse.step-2 { animation-delay: 1.05s; } .pulse.step-3 { animation-delay: 1.9s; } .pulse.step-4 { animation-delay: 2.75s; }
      @keyframes trace { from { opacity: 0.12; stroke-dashoffset: 92; } to { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { opacity: 1; animation: none; } }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="0" y="748" width="1600" height="152" fill="#dce9e9"/>
  <rect x="0" y="748" width="1600" height="152" fill="url(#soil)" opacity="0.75"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="86" y="82" font-size="26" font-weight="750" letter-spacing="3" fill="#0a9b91">ACTIVE-USER BEAM BRIDGE</text>
    <text x="86" y="145" font-size="52" font-weight="760" fill="#0b1838">Load path: contact surface to ground</text>
    <text x="87" y="192" font-size="25" fill="#4f6275">Orthographic elevation with the load-transfer stages separated from the analytical reactions.</text>
    <g stroke="#0b1838" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="615" cy="302" r="18"/><path d="M615 320 V351 M615 331 L590 342 M615 331 L642 342 M615 351 L598 371 M615 351 L635 371"/>
      <circle cx="921" cy="341" r="29"/><circle cx="1011" cy="341" r="29"/><path d="M921 341 L961 295 L992 341 L952 341 Z M961 295 L940 270 L996 270 M961 295 L1011 341 M952 341 L910 302 M961 295 L928 295"/>
      <circle cx="999" cy="249" r="16"/><path d="M999 265 L977 294 L944 302 M977 294 L1006 315"/>
    </g>
    <g class="flow step-1" fill="none" stroke="#e58a2b" stroke-width="5" marker-end="url(#arrowOrange)">
      <path d="M360 257 V351"/><path d="M500 257 V351"/><path d="M750 257 V351"/><path d="M1110 257 V351"/><path d="M1245 257 V351"/><path d="M615 218 V286"/><path d="M966 203 V233"/>
    </g>
    <text x="360" y="236" font-size="20" font-weight="760" fill="#b55e16">w<tspan baseline-shift="sub" font-size="14">D</tspan> · DISTRIBUTED SELF-WEIGHT</text>
    <text x="1100" y="230" text-anchor="middle" font-size="20" font-weight="760" fill="#b55e16">P<tspan baseline-shift="sub" font-size="14">U</tspan> · USER LOADS</text>
    <g filter="url(#shadow)">
      <rect x="190" y="371" width="1220" height="22" rx="5" fill="#8da2ae"/>
      <path d="M220 393 H1380 L1367 431 H233 Z" fill="#d6e3e4" stroke="#91a6ad" stroke-width="3"/>
      <g fill="#0a9b91" opacity="0.88"><rect x="340" y="397" width="12" height="30"/><rect x="565" y="397" width="12" height="30"/><rect x="790" y="397" width="12" height="30"/><rect x="1015" y="397" width="12" height="30"/><rect x="1240" y="397" width="12" height="30"/></g>
    </g>
    <g class="flow step-2" fill="none" stroke="#0a9b91" stroke-width="5" marker-end="url(#arrowTeal)"><path d="M800 351 V418"/></g>
    <rect class="pulse step-2" x="640" y="377" width="320" height="42" rx="21" fill="#ffffff" stroke="#0a9b91" stroke-width="2"/>
    <text x="800" y="405" text-anchor="middle" font-size="20" font-weight="760" fill="#007a74">1 · DECK + TRANSVERSE DISTRIBUTION</text>
    <g class="pulse step-3" filter="url(#shadow)">
      <rect x="255" y="439" width="1090" height="12" rx="3" fill="#17315f"/><rect x="276" y="451" width="1048" height="38" fill="url(#girder)"/><rect x="255" y="489" width="1090" height="12" rx="3" fill="#0b1838"/>
    </g>
    <g class="flow step-3" fill="none" stroke="#0a9b91" stroke-width="5" marker-end="url(#arrowTeal)"><path d="M800 421 V471"/></g>
    <rect x="650" y="451" width="300" height="42" rx="21" fill="#ffffff" stroke="#0a9b91" stroke-width="2"/>
    <text x="800" y="479" text-anchor="middle" font-size="20" font-weight="760" fill="#007a74">2 · LONGITUDINAL GIRDER</text>
    <g class="pulse step-4">
      <g fill="#0a9b91"><rect x="306" y="505" width="88" height="17" rx="4"/><rect x="1206" y="505" width="88" height="17" rx="4"/></g>
      <g fill="#17315f"><rect x="270" y="522" width="160" height="28" rx="4"/><rect x="1170" y="522" width="160" height="28" rx="4"/></g>
      <g fill="#91a6ad"><path d="M302 550 H398 L420 680 H280 Z"/><path d="M1202 550 H1298 L1320 680 H1180 Z"/></g>
      <g fill="#17315f"><rect x="240" y="680" width="220" height="34" rx="3"/><rect x="1140" y="680" width="220" height="34" rx="3"/></g>
      <g fill="#aabdc0"><path d="M268 714 H432 L466 748 H234 Z"/><path d="M1168 714 H1332 L1366 748 H1134 Z"/></g>
    </g>
    <g class="flow step-4" fill="none" stroke="#0b1838" stroke-width="5" marker-end="url(#arrowNavy)"><path d="M350 481 V515"/><path d="M1250 481 V515"/></g>
    <g class="flow step-4" fill="none" stroke="#0a9b91" stroke-width="5" marker-end="url(#arrowTeal)"><path d="M350 780 V719"/><path d="M1250 780 V719"/></g>
    <rect x="570" y="555" width="460" height="46" rx="23" fill="#ffffff" stroke="#c4d3d5" stroke-width="2"/>
    <text x="800" y="585" text-anchor="middle" font-size="20" font-weight="760" fill="#0b1838">3 · BEARINGS → CAPS → PIERS → FOOTINGS</text>
    <text x="350" y="816" text-anchor="middle" font-size="20" font-weight="760" fill="#007a74">SUPPORT REACTION R<tspan baseline-shift="sub" font-size="14">A</tspan></text>
    <text x="1250" y="816" text-anchor="middle" font-size="20" font-weight="760" fill="#007a74">SUPPORT REACTION R<tspan baseline-shift="sub" font-size="14">B</tspan></text>
    <text x="86" y="868" font-size="18" fill="#647789">Conceptual force path · member proportions and foundation type are not project dimensions</text>
    <text x="1514" y="868" font-size="18" text-anchor="end" fill="#647789">Animation plays once · reduced-motion preference respected</text>
  </g>
</svg>
