<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Route 601 pultruded FRP beam bridge case study</title>
  <desc id="desc">An original engineering cutaway of the Route 601 bridge over Dickey Creek in Sugar Grove, Virginia. The 39 foot span used eight 36 inch deep pultruded FRP double-web beams at 3.5 foot spacing, installed in four hours, with measured maximum deflection of span over 1110.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#e5f0ef"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b89568"/>
      <stop offset="1" stop-color="#80603e"/>
    </linearGradient>
    <linearGradient id="frp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087a73"/>
      <stop offset="0.5" stop-color="#0a9b91"/>
      <stop offset="1" stop-color="#075f5a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1838" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0a9b91"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#ef8d32"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 682 C210 635 410 703 660 656 C900 611 1128 690 1600 626 L1600 900 L0 900 Z" fill="#cbded2"/>
  <path d="M0 774 C260 722 520 795 765 745 C1040 688 1320 757 1600 713 L1600 900 L0 900 Z" fill="#9ed0d0"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(70 58)">
      <rect width="400" height="42" rx="21" fill="#0b1838"/>
      <text x="200" y="28" font-size="18" font-weight="750" letter-spacing="1.2" text-anchor="middle" fill="#ffffff">PUBLIC ENGINEERING REFERENCE</text>
    </g>
    <text x="70" y="151" font-size="49" font-weight="770" fill="#0b1838">Route 601 over Dickey Creek</text>
    <text x="71" y="195" font-size="25" fill="#4f6275">Sugar Grove, Virginia, USA · Vehicular bridge completed October 2001</text>

    <g transform="translate(1130 48)">
      <rect width="400" height="170" rx="24" fill="#ffffff" opacity="0.97"/>
      <rect width="9" height="170" rx="4" fill="#ef8d32"/>
      <text x="32" y="43" font-size="17" font-weight="750" letter-spacing="1" fill="#b85f16">FIELD RESULT</text>
      <text x="32" y="86" font-size="36" font-weight="820" fill="#0b1838">L/1110</text>
      <text x="32" y="119" font-size="18" fill="#4f6275">measured maximum deflection</text>
      <text x="32" y="146" font-size="16" fill="#6b7e8e">reported by VTRC after load testing</text>
    </g>

    <g transform="translate(114 303)" filter="url(#shadow)">
      <g fill="#0b1838">
        <path d="M0 313 L122 313 L168 380 L-45 380 Z"/>
        <path d="M1156 313 L1278 313 L1323 380 L1110 380 Z"/>
      </g>
      <g fill="#8fa4a8">
        <rect x="20" y="289" width="80" height="24" rx="5"/>
        <rect x="1178" y="289" width="80" height="24" rx="5"/>
      </g>

      <g transform="translate(95 0)">
        <path d="M0 91 L1058 19 L1058 82 L0 168 Z" fill="url(#deck)"/>
        <path d="M0 168 L1058 82 L1058 114 L0 204 Z" fill="#5e462e"/>
        <g stroke="#d8bf98" stroke-width="3" opacity="0.7">
          <path d="M122 82 L122 158 M244 74 L244 148 M366 66 L366 138 M488 57 L488 128 M610 49 L610 118 M732 41 L732 108 M854 32 L854 98 M976 24 L976 88"/>
        </g>

        <g fill="url(#frp)" stroke="#075f5a" stroke-width="2">
          <g transform="translate(0 182)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(144 170)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(288 158)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(432 146)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(576 134)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(720 122)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(864 110)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
          <g transform="translate(1008 98)"><path d="M0 0 H104 L100 15 H67 V74 H100 L104 90 H0 L4 74 H37 V15 H4 Z"/></g>
        </g>
      </g>
    </g>

    <g transform="translate(217 258)">
      <line x1="0" y1="0" x2="1060" y2="0" stroke="#0a9b91" stroke-width="4" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
      <rect x="433" y="-28" width="194" height="56" rx="28" fill="#e7faf8" stroke="#0a9b91" stroke-width="2"/>
      <text x="530" y="8" font-size="24" font-weight="800" text-anchor="middle" fill="#007a74">39 ft span</text>
    </g>

    <g transform="translate(123 724)">
      <g>
        <rect width="312" height="104" rx="18" fill="#ffffff" opacity="0.97"/>
        <text x="23" y="41" font-size="31" font-weight="820" fill="#0b1838">8 girders</text>
        <text x="23" y="74" font-size="18" fill="#4f6275">pultruded FRP double-web</text>
      </g>
      <g transform="translate(332)">
        <rect width="312" height="104" rx="18" fill="#ffffff" opacity="0.97"/>
        <text x="23" y="41" font-size="31" font-weight="820" fill="#0b1838">36 in deep</text>
        <text x="23" y="74" font-size="18" fill="#4f6275">structural beam section</text>
      </g>
      <g transform="translate(664)">
        <rect width="312" height="104" rx="18" fill="#ffffff" opacity="0.97"/>
        <text x="23" y="41" font-size="31" font-weight="820" fill="#0b1838">3.5 ft spacing</text>
        <text x="23" y="74" font-size="18" fill="#4f6275">girder center to center</text>
      </g>
      <g transform="translate(996)">
        <rect width="312" height="104" rx="18" fill="#ffffff" opacity="0.97"/>
        <text x="23" y="41" font-size="31" font-weight="820" fill="#0b1838">4 hours</text>
        <text x="23" y="74" font-size="18" fill="#4f6275">reported girder installation</text>
      </g>
    </g>

    <text x="70" y="882" font-size="17" fill="#5b6d7e">Public project reference · not an F1 project</text>
    <text x="1530" y="882" font-size="17" text-anchor="end" fill="#5b6d7e">Engineering illustration · not to scale</text>
  </g>
</svg>
