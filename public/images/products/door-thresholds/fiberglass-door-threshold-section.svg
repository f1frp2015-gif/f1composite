<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" fill="none">
  <title>F1 fiberglass door threshold — concept section</title>
  <desc>Illustrative hollow pultruded threshold. A raised seal interface sits toward the interior, with a sloping exterior surface and continuous support beneath the base. This is not a production drawing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="780" gradientUnits="userSpaceOnUse"><stop stop-color="#102448"/><stop offset="1" stop-color="#07162D"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
    <pattern id="support" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#59708B" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#58D7CE"/></marker>
  </defs>
  <rect width="1200" height="780" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="780" rx="20" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="68" fill="#58D7CE" font-size="19" font-weight="700" letter-spacing="3">F1 / THRESHOLD DESIGN</text>
    <text x="58" y="115" fill="white" font-size="34" font-weight="700">One continuous composite section</text>
    <text x="58" y="149" fill="#B9C7DA" font-size="18">Hollow profile concept · section across the door opening</text>
    <text x="80" y="222" fill="#B9C7DA" font-size="17" letter-spacing="2">INTERIOR</text>
    <text x="922" y="222" fill="#B9C7DA" font-size="17" letter-spacing="2">EXTERIOR</text>

    <!-- Generic original geometry, intentionally not copied from a system drawing. -->
    <path d="M130 495V415H325V356H400V401H770L1030 453V495Z" fill="#36ADA8" stroke="#75E5DB" stroke-width="4"/>
    <path d="M151 475V436H306V475Z M328 475V436H347V376H380V475Z M403 422H555V475H403Z M577 422H728V475H577Z M750 422L896 451V475H750Z M918 455L1008 472V475H918Z" fill="#102448" stroke="#75E5DB" stroke-width="2"/>
    <!-- Separate seal concept above the pultruded carrier. -->
    <path d="M338 347V323Q338 306 358 306H369Q389 306 389 323V347" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>
    <path d="M805 375L1008 416" stroke="#58D7CE" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M110 511H1050V544H110Z" fill="url(#support)"/>
    <path d="M110 511H1050" stroke="#98ACC5" stroke-width="3"/>

    <g stroke="#A3B9D1" stroke-width="2">
      <path d="M367 300V260H497"/>
      <path d="M566 446V317H610"/>
      <path d="M884 390V289H984"/>
      <path d="M580 529V604H690"/>
    </g>
    <g fill="#FFFFFF" font-size="21" font-weight="700">
      <text x="507" y="266">Seal interface</text>
      <text x="620" y="323">Pultruded GRP body</text>
      <text x="760" y="275">Exterior fall</text>
      <text x="702" y="611">Supported base</text>
    </g>
    <g fill="#58D7CE"><circle cx="367" cy="300" r="5"/><circle cx="566" cy="446" r="5"/><circle cx="884" cy="390" r="5"/><circle cx="580" cy="529" r="5"/></g>
    <path d="M58 665H1142" stroke="#344761"/>
    <text x="58" y="704" fill="#B9C7DA" font-size="18">Specify: frame fit / seals / drainage / support / finish</text>
    <text x="58" y="739" fill="#91A5BF" font-size="16">Concept only. No dimensions, performance rating or system compatibility implied.</text>
  </g>
</svg>
