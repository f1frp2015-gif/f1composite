<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc"><title id="title">Carbon fiber pultrusion process</title><desc id="desc">Five-stage conceptual process: carbon tow feeds through resin impregnation, a heated die, a puller, and a cut-to-length station. Arrows indicate left-to-right flow.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e9eff4"/></linearGradient><linearGradient id="carbon" x2="0.2" y2="1"><stop stop-color="#47515c"/><stop offset=".45" stop-color="#202933"/><stop offset="1" stop-color="#111820"/></linearGradient><linearGradient id="edge" x2="1" y2="1"><stop stop-color="#65717c"/><stop offset="1" stop-color="#202933"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="45" y="55" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#00A199">CONTINUOUS PULTRUSION</text><text x="45" y="98" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#031697">From carbon tow to a constant cross-section</text><path d="M245 250h40m-10 -7 10 7-10 7" fill="none" stroke="#00A199" stroke-width="3"/><path d="M515 250h40m-10 -7 10 7-10 7" fill="none" stroke="#00A199" stroke-width="3"/><path d="M785 250h40m-10 -7 10 7-10 7" fill="none" stroke="#00A199" stroke-width="3"/><path d="M1055 250h40m-10 -7 10 7-10 7" fill="none" stroke="#00A199" stroke-width="3"/><text x="45" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00A199">01</text><text x="45" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031697">Carbon tow</text><text x="45" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#52616f">Continuous fiber feed</text><text x="315" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00A199">02</text><text x="315" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031697">Resin impregnation</text><text x="315" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#52616f">Wet and align fibers</text><text x="585" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00A199">03</text><text x="585" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031697">Heated die</text><text x="585" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#52616f">Shape and cure</text><text x="855" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00A199">04</text><text x="855" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031697">Puller</text><text x="855" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#52616f">Maintain continuous motion</text><text x="1125" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00A199">05</text><text x="1125" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#031697">Cut to length</text><text x="1125" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#52616f">Finish to specification</text><ellipse cx="85" cy="195" rx="24" ry="16" fill="url(#edge)"/><ellipse cx="85" cy="195" rx="8" ry="6" fill="#dce4eb"/><path d="M108 195 225 250" stroke="#394550" stroke-width="3"/><ellipse cx="85" cy="235" rx="24" ry="16" fill="url(#edge)"/><ellipse cx="85" cy="235" rx="8" ry="6" fill="#dce4eb"/><path d="M108 235 225 250" stroke="#394550" stroke-width="3"/><ellipse cx="85" cy="275" rx="24" ry="16" fill="url(#edge)"/><ellipse cx="85" cy="275" rx="8" ry="6" fill="#dce4eb"/><path d="M108 275 225 250" stroke="#394550" stroke-width="3"/><path d="M320 215v85h170v-85" fill="#d2ece9" stroke="#00A199" stroke-width="3"/><path d="M325 270h160" stroke="#00A199" stroke-width="2"/><path d="M315 245 375 280h60l60-35" fill="none" stroke="#36434f" stroke-width="4"/><path d="M585 205h175v95H585Z" fill="#ccd6df"/><path d="M585 205 610 185h175l-25 20" fill="#e4eaf0"/><path d="M760 205 785 185v95l-25 20" fill="#a4b3c1"/><path d="M575 250h220" stroke="#26313c" stroke-width="9"/><path d="M620 232q-8-8 0-16t0-16" fill="none" stroke="#00A199" stroke-width="2"/><path d="M665 232q-8-8 0-16t0-16" fill="none" stroke="#00A199" stroke-width="2"/><path d="M710 232q-8-8 0-16t0-16" fill="none" stroke="#00A199" stroke-width="2"/><path d="M850 250h220" stroke="#26313c" stroke-width="9"/><rect x="870" y="209" width="165" height="30" rx="15" fill="url(#edge)"/><rect x="870" y="261" width="165" height="30" rx="15" fill="url(#edge)"/><path d="M900 224h100m-10-5 10 5-10 5" fill="none" stroke="#dbe7ee" stroke-width="2"/><path d="M1120 250h90m20 0h100" stroke="#26313c" stroke-width="10"/><circle cx="1220" cy="218" r="37" fill="#b3c1cd" stroke="#7b8d9d" stroke-width="3"/><circle cx="1220" cy="218" r="7" fill="#031697"/><path d="M1220 177v-25" stroke="#031697" stroke-width="4"/><text x="45" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#657481">Conceptual process illustration • Equipment and process details vary by product and resin system.</text></svg>