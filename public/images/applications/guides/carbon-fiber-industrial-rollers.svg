<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Industrial roller interfaces</title><desc id="desc">Axial section showing the composite shell bonded to end plugs connected to journals, bearings and frame supports. A separate end view shows tangential web entry, a continuous 90-degree wrap and downward tangential exit. Schematic, not to scale.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8eef2" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#00a199" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#233a50}.label{font-size:25px;font-weight:600}.small{font-size:19px;letter-spacing:.7px}.leader{fill:none;stroke:#657c8e;stroke-width:2.5}.steel{fill:none;stroke:#81909e;stroke-width:10}.arrow{fill:none;stroke:#00a199;stroke-width:5;marker-end:url(#arrow)}</style>
<rect width="1200" height="800" fill="#f8fafb"/><rect y="118" width="1200" height="560" fill="url(#grid)"/>
<rect x="0" width="12" height="118" fill="#00a199"/><text x="42" y="53" font-size="31" font-weight="700">Industrial roller interfaces</text><text x="42" y="89" font-size="21">Shell stiffness is only one part of a complete rotating assembly</text>

<!-- Axial section makes shell-to-plug-to-journal load path explicit. -->
<text x="76" y="175" class="small">ASSEMBLY: AXIAL SECTION</text>
<rect x="130" y="338" width="65" height="145" fill="#ccd6df" stroke="#8190a0" stroke-width="3"/>
<rect x="601" y="338" width="65" height="145" fill="#ccd6df" stroke="#8190a0" stroke-width="3"/>
<rect x="111" y="483" width="103" height="16" fill="#8190a0"/><rect x="582" y="483" width="103" height="16" fill="#8190a0"/>
<rect x="143" y="355" width="39" height="84" fill="#f8fafb" stroke="#657c8e" stroke-width="4"/>
<rect x="614" y="355" width="39" height="84" fill="#f8fafb" stroke="#657c8e" stroke-width="4"/>
<rect x="110" y="382" width="136" height="30" fill="#8190a0"/><rect x="550" y="382" width="136" height="30" fill="#8190a0"/>
<rect x="230" y="347" width="44" height="100" fill="#aebcc8" stroke="#657c8e" stroke-width="3"/><rect x="522" y="347" width="44" height="100" fill="#aebcc8" stroke="#657c8e" stroke-width="3"/>
<path d="M230 347H566M230 447H566" stroke="#e4b63e" stroke-width="7"/>
<rect x="226" y="330" width="344" height="14" fill="#00a199" stroke="#0d675f" stroke-width="2"/><rect x="226" y="450" width="344" height="14" fill="#00a199" stroke="#0d675f" stroke-width="2"/>
<path d="M390 330V241" class="leader"/><text x="283" y="217" class="label">CFRP shell</text>
<path d="M544 425V541H466" class="leader"/><text x="341" y="579" class="label">Bonded end plug</text>
<path d="M151 438L98 545" class="leader"/><text x="64" y="578" class="label">Bearing</text>
<text x="64" y="619" class="small">Shell → end plugs → journals → bearings → frame</text>
<path d="M729 165V630" stroke="#ccd6df" stroke-width="2"/>
<text x="790" y="175" class="small">WEB: END VIEW</text>
<circle cx="915" cy="383" r="85" fill="#dce5ec" stroke="#0d675f" stroke-width="5"/><circle cx="915" cy="383" r="14" fill="#8190a0"/>
<!-- Tangent entry at top, 90 degree wrap, tangent vertical exit. -->
<path d="M780 293H915A90 90 0 0 1 1005 383V547" fill="none" stroke="#e4b63e" stroke-width="8"/>
<path d="M799 264H874" class="arrow"/><path d="M1043 435V517" class="arrow"/>
<text x="783" y="232" class="small">Web travel</text>
<text x="795" y="593" class="small">Illustrative 90° wrap</text>
<rect y="687" width="1200" height="113" fill="#031e35"/><path d="M599 708V778" stroke="#426174"/>
<text x="38" y="729" style="fill:#79d8ce;font-size:22px;font-weight:700">Specify the rotating duty</text><text x="38" y="769" style="fill:#fff;font-size:19px">Web load • span • speed • torque • vibration</text>
<text x="625" y="729" style="fill:#79d8ce;font-size:22px;font-weight:700">Define assembly acceptance</text><text x="625" y="769" style="fill:#fff;font-size:19px">Runout • bearings • surface • balance • end joints</text>
