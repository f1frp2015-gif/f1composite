<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">MRI patient-support interfaces</title><desc id="desc">Longitudinal section of an MRI scanner with a sliding composite patient support entering an open bore, supported by a pedestal and separated from the housing by a schematic clearance. CFRP is conductive. No MR safety classification is implied.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8eef2"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#00a199" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#233a50}.label{font-size:24px;font-weight:600}.small{font-size:19px}.leader{fill:none;stroke:#657c8e;stroke-width:2.5}.arrow{fill:none;stroke:#00a199;stroke-width:5;marker-end:url(#arrow)}</style><rect width="1200" height="800" fill="#f8fafb"/><rect y="118" width="1200" height="560" fill="url(#grid)"/><rect width="12" height="118" fill="#00a199"/><text x="42" y="53" font-size="31" font-weight="700">MRI patient-support interfaces</text><text x="42" y="89" font-size="21">Longitudinal section • mechanical and MR assessments are separate</text>

