<title id="title">Insulating rod and tube components</title><desc id="desc">Rod or tube assembly with metal fittings and an exposed insulating section measured between fitting edges. Separate solid-rod and foam-filled-tube cross-sections. No working-distance or voltage rating is specified.</desc>
