<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Third-rail cover interfaces</title><desc id="desc">Side-contact conductor rail on an insulating support, with separate cover bracket, FRP cover, collector shoe and dashed travel envelope. Illustrative arrangement, not to scale.</desc>
