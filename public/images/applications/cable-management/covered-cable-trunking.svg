  <text class="label" x="52" y="107">LIFT-OFF COVER</text>
  <path class="leader" d="M603 346H703V300L590 267"/>
  <circle cx="590" cy="267" r="3" fill="#00A199"/>
  <text class="label" x="603" y="369">COVER CLIPS</text>
  <path class="leader" d="M52 438H147L202 374"/>
  <circle cx="202" cy="374" r="3" fill="#00A199"/>
  <text class="label" x="52" y="465">SOLID-BOTTOM BODY</text>
  <text x="32" y="501" font-size="18" fill="#50637B">EXPLODED SCHEMATIC · Cover profile and retention detail are product-specific.</text>
