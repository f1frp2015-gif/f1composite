name: IndexNow URL notifications

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      urls:
        description: "Canonical URLs or paths to submit, separated by spaces, commas, or new lines"
        required: true
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for the Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')"
            if [ "$state" = "success" ]; then
              echo "Vercel production deployment is ready."
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel production deployment failed; IndexNow submission stopped."
              exit 1
            fi
            echo "Waiting for Vercel production deployment (attempt ${attempt}/40, state=${state})..."
            sleep 15
          done
          echo "Timed out waiting for Vercel production deployment."
          exit 1

      - name: Submit changed, redirected, or deleted URLs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_URLS: ${{ inputs.urls }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/submit-indexnow.mjs --urls "$MANUAL_URLS"
          else
            node scripts/submit-indexnow.mjs --before "$BEFORE_SHA" --after "$AFTER_SHA"
          fi
