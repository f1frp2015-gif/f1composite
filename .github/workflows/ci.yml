name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/navigation-ia.test.mjs scripts/taxonomy-upgrade.test.mjs
      - run: npm run test:site-audit
      - run: npm run test:indexnow
      - run: npm run build
